; CosmeticExt -- soundmd.ini distance examples.
; Every key is documented in docs/soundmd-tags.md. Merge what you want into
; your mod's soundmd.ini: these sections REPLACE the vanilla ones of the same
; name, so keep their vanilla keys as shown.

[CosmeticExt]
Enabled=yes
LogBudget=30             ; debug.log lines about band picks / delays per launch
QueueMax=128
; Uncomment to give EVERY sound physical spreading instead of vanilla's
; straight-line fade (louder near the screen, longer tail):
;Distance.Falloff=inverse
; Defaults for the offline baker (tools/distance_bake.py):
Distance.Bake.CellMeters=25
Distance.Bake.Humidity=60


; --- 1. Hand-made files per distance ------------------------------------
; Three recordings of one explosion: the vanilla close-up for on screen, a
; "nearby, off screen" version and a "far away" version you made yourself.
; The off-screen ones are ordinary sounds, so all three need [SoundList]
; entries. Add them to the end of your existing [SoundList] rather than
; starting a second one, numbering on from the last entry:
;   2000=BigBoom
;   2001=BigBoomNear
;   2002=BigBoomFar

[BigBoom]
Sounds= $bigboom1 $bigboom2
Control= random interrupt
Volume=90
Range=12
Distance.Bands=BigBoomNear,BigBoomFar
Distance.Bands.From=3,15         ; >3 cells off screen: Near; >15: Far
Distance.Falloff=inverse         ; the bands inherit this

[BigBoomNear]
Sounds= $bigboom1_near $bigboom2_near
Control= random interrupt
Volume=90
Range=24

[BigBoomFar]
Sounds= $bigboom_far
Volume=90
Range=60
Distance.Rolloff=4.5             ; its own value wins over BigBoom's


; --- 2. Runtime physics only (no new files) -----------------------------
; Vanilla tank-shot impacts, made to carry: inverse-square spreading, a
; little wind in the level, stereo smearing far out, a short travel delay
; and one slap-back echo when well off screen.

[Explosion14]
Sounds= gexp14a gexp14b gexp14c gexp14d
FShift= -10 10
Control= random interrupt
Range=30
Distance.Falloff=inverse
Distance.Reference=8
Distance.Scatter=3               ; up to +-3 dB at Range
Distance.Diffuse=0.6             ; 60 % of the way to centre at Range
Distance.Delay=0.3               ; frames per cell beyond the screen edge
Distance.Delay.Max=20
Distance.Echo=1
Distance.Echo.Delay=10
Distance.Echo.Volume=0.3
Distance.Echo.From=12


; --- 3. Baked physics (frequency effects) -------------------------------
; The baker renders muffled, hollow, rolling variants from the vanilla
; samples, writes them to audio97.bag and fills in Distance.Bands for you:
;   python3 tools/distance_bake.py --soundmd soundmd.ini --game <RA2 dir> --out bake-out
; Then copy bake-out/audio97.idx, audio97.bag and soundmd.ini into the mod.

[NukeExplosion]
Sounds=snukexpl
Type=global
MinVolume=50
Distance.Bake=yes
Distance.Bake.Bands=6,20,45      ; three variants: >6, >20, >45 cells
Distance.Bake.Tail=0.5           ; long rolling tail at the far band
Distance.Bake.TailTime=2.5

[Explosion12]
Sounds= gexp14a gexp14b gexp14c gexp14d
FShift= -10 10
Limit=3
Control= random interrupt
Distance.Bake=yes                ; default bands 4,14,32

; The engine does not read the last line of an INI.
